<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments :: page_head('Account Detail')"></head>
  <style>
    .account-form-margin {
      margin-top: 50px;
    }

    @media (min-width: 992px) {
      .account-form-margin {
        margin-top: 120px;
      }
    }
  </style>

  <body>
    <div th:replace="navigation :: menu"></div>
    <div class="container account-form-margin">
      <div class="text-center mt-3">
        <h2>Your Account Details</h2>
      </div>
      <div>&nbsp;</div>

      <form
        th:action="@{/update_account_details}"
        method="post"
        th:object="${customer}"
        style="max-width: 500px; margin: 0 auto"
      >
        <input type="hidden" th:field="*{id}" />
        <div th:if="${message != null}" class="alert alert-success text-center">
          [[${message}]]
        </div>
        <div class="border border-secondary rounded p-3">
          <div class="form-group row">
            <label class="col-sm-4 col-form-label">E-mail:</label>
            <div class="col-sm-8">
              <input
                type="text"
                th:field="*{email}"
                class="form-control"
                readonly="readonly"
              />
            </div>
          </div>

          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Name:</label>
            <div class="col-sm-8">
              <input
                type="text"
                th:field="*{name}"
                class="form-control"
                required="required"
                maxlength="45"
                minlength="2"
              />
            </div>
          </div>

          <th:block th:if="${customer.authenticationType.name() == 'DATABASE'}">
            <div class="form-group row">
              <label class="col-sm-4 col-form-label">Password:</label>
              <div class="col-sm-8">
                <input
                  type="password"
                  th:field="*{password}"
                  class="form-control"
                  maxlength="15"
                  minlength="6"
                  oninput="checkPasswordMatch(document.getElementById('confirmPassword'))"
                />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-sm-4 col-form-label">Re-type Password:</label>
              <div class="col-sm-8">
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-control"
                  maxlength="15"
                  minlength="6"
                  oninput="checkPasswordMatch(this)"
                />
              </div>
            </div>
          </th:block>

          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Phone Number:</label>
            <div class="col-sm-8">
              <input
                type="text"
                th:field="*{phoneNumber}"
                class="form-control"
                required="required"
                maxlength="15"
                minlength="8"
              />
            </div>
          </div>

          <div class="form-group row">
            <label class="col-sm-4 col-form-label">Address:</label>
            <div class="col-sm-8">
              <input
                type="text"
                th:field="*{address}"
                class="form-control"
                required="required"
                maxlength="64"
                minlength="3"
              />
            </div>
          </div>

          <div class="text-center">
            <input type="submit" value="Update" class="btn btn-primary" />
          </div>
        </div>
      </form>
    </div>
  </body>

  <script type="text/javascript">
    contextPath = "[[@{/}]]";
  </script>
  <script
    type="text/javascript"
    th:src="@{/js/common_customer_form.js}"
  ></script>
  <script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/jquery-migrate-3.0.1.min.js}"></script>
  <script th:src="@{/js/popper.min.js}"></script>
  <script th:src="@{/js/bootstrap.min.js}"></script>
  <script th:src="@{/js/jquery.easing.1.3.js}"></script>
  <script th:src="@{/js/jquery.waypoints.min.js}"></script>
  <script th:src="@{/js/jquery.stellar.min.js}"></script>
  <script th:src="@{/js/owl.carousel.min.js}"></script>
  <script th:src="@{/js/jquery.magnific-popup.min.js}"></script>
  <script th:src="@{/js/aos.js}"></script>
  <script th:src="@{/js/jquery.animateNumber.min.js}"></script>
  <script th:src="@{/js/bootstrap-datepicker.js}"></script>
  <script th:src="@{/js/jquery.timepicker.min.js}"></script>
  <script th:src="@{/js/scrollax.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</html>
