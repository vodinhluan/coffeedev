<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="menu">
      <nav
        class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light"
        id="ftco-navbar"
      >
        <div class="container">
          <a class="navbar-brand" th:href="@{/}">Coffee<small>Dev</small></a>
          <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#ftco-nav"
            aria-controls="ftco-nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="oi oi-menu"></span> Menu
          </button>
          <div class="collapse navbar-collapse" id="ftco-nav">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item active">
                <a th:href="@{/}" class="nav-link">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  id="dropdown04"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                  >Menu</a
                >
                <div class="dropdown-menu" aria-labelledby="dropdown04">
                  <th:block th:each="category : ${listCategories}">
                    <!-- Nếu category có children thì tạo dropdown -->
                    <div
                      th:if="${not #lists.isEmpty(category.children)}"
                      class="dropdown-submenu"
                    >
                      <a
                        class="dropdown-item dropdown-toggle"
                        href="#"
                        th:text="${category.name}"
                      ></a>
                      <ul class="dropdown-menu">
                        <li th:each="child : ${category.children}">
                          <a
                            class="dropdown-item"
                            th:href="@{/c/{name}(name=${child.name})}"
                            th:text="${child.name}"
                          >
                          </a>
                        </li>
                      </ul>
                    </div>
                    <!-- Nếu không có children thì chỉ hiển thị item đơn -->
                    <a
                      th:if="${#lists.isEmpty(category.children)}"
                      class="dropdown-item"
                      th:href="@{/c/{name}(name=${category.name})}"
                      th:text="${category.name}"
                    >
                    </a>
                  </th:block>
                </div>
              </li>

              <!-- CSS hỗ trợ hover dropdown -->
              <style>
                /* Khi hover vào category cha có con, hiển thị danh mục con */
                .dropdown-submenu {
                  position: relative;
                }

                .dropdown-submenu .dropdown-menu {
                  display: none;
                  position: absolute;
                  left: 100%;
                  top: 0;
                  margin-top: -5px;
                }

                .dropdown-submenu:hover > .dropdown-menu {
                  display: block;
                }

                .dropdown-menu {
                  display: none;
                }

                .dropdown-item:hover + .dropdown-menu,
                .dropdown-menu:hover {
                  display: block;
                }
              </style>

              <li class="nav-item dropdown">
                <div class="dropdown-menu" aria-labelledby="dropdown04">
                  <a class="dropdown-item" th:href="@{/cart}">Cart</a>
                  <a class="dropdown-item" th:href="@{/checkout}">Checkout</a>
                </div>
              </li>
              <li class="nav-item">
                <a th:href="@{/contact}" class="nav-link">Contact</a>
              </li>
              <li class="nav-item cart">
                <a href="@{/cart}" class="nav-link" th:href="@{/cart}"
                  ><span class="icon icon-shopping_cart"></span
                ></a>
              </li>
              <li
                class="nav-item"
                th:unless="${#authorization.expression('isAuthenticated()')}"
              >
                <a th:href="@{/login}" class="nav-link">Đăng Ký/Đăng Nhập</a>
              </li>
              <th:block sec:authorize="isAuthenticated()">
                <li class="nav-item">
                  <a
                    class="nav-link"
                    th:href="@{/account_details}"
                    sec:authentication="principal.fullName"
                  ></a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link"
                    href="javascript: document.logoutForm.submit()"
                    >Logout</a
                  >
                </li>
              </th:block>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </body>
</html>
